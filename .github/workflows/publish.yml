name: Publish npm package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  pack:
    if: github.ref == 'refs/heads/master'
    name: Pack candidate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Pack npm candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  consumer:
    name: Packed consumer
    needs: pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name: Install packed candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/webgl'

      - name: Load public entry
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: node --input-type=module -e "await import('@node-3d/webgl')"

  publish:
    name: Publish to npm
    needs: consumer
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - name: Download validated candidate
        uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Publish validated tarball
        shell: bash
        run: |
          mapfile -t tarballs < <(find "$RUNNER_TEMP/npm-package" -maxdepth 1 -type f -name '*.tgz')
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one npm tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          npm publish "${tarballs[0]}" --provenance
